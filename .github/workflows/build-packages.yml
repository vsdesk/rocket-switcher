name: Build Packages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  # ---- Unit tests and the Linux GUI (Ubuntu) ----
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential \
            qt6-base-dev \
            libgtest-dev googletest

      - name: Configure (tests enabled)
        run: |
          rm -rf build
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DBUILD_FCITX=OFF

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run tests
        run: ctest --test-dir build --output-on-failure -V

  # ---- Core tests on macOS. The Linux daemon is not built here. ----
  core-tests:
    name: Core tests (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure, build, test
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DBUILD_GUI=OFF \
            -DBUILD_DAEMON=OFF \
            -DBUILD_FCITX=OFF
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          ctest --test-dir build --output-on-failure

  # ---- Build .deb (Ubuntu 24.04, native — после каждого пуша) ----
  build-deb:
    name: Build .deb (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    needs: unit-tests
    steps:
      - uses: actions/checkout@v5

      - name: Install packaging build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debhelper cmake pkg-config dh-cmake \
            qt6-base-dev libevdev-dev libxkbcommon-dev \
            dpkg-dev fakeroot build-essential

      - name: Build .deb and copy to dist/
        run: |
          chmod +x scripts/build-deb.sh
          ./scripts/build-deb.sh

      - name: Upload .deb artefact
        uses: actions/upload-artifact@v4
        with:
          name: rocket-switcher-deb
          path: dist/*.deb
          retention-days: 30

  # ---- Build .rpm (Fedora 41) ----
  build-rpm:
    name: Build .rpm (Fedora 41)
    runs-on: ubuntu-24.04
    needs: unit-tests
    steps:
      - uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -f docker/Dockerfile.rpm -t punto-rpm-builder .

      - name: Run build container
        run: |
          mkdir -p dist
          docker run --rm -v "$PWD/dist:/dist" punto-rpm-builder

      - name: Upload .rpm artefact
        uses: actions/upload-artifact@v4
        with:
          name: rocket-switcher-rpm
          path: dist/*.rpm
          retention-days: 30

  # ---- macOS app. Zip and dmg always go to the release. Signing runs when Apple secrets exist. ----
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: [unit-tests, core-tests]
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: mac
          target: desktop
          arch: clang_64
          archives: qtbase qttools
          cache: true

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DBUILD_TESTING=OFF \
            -DBUILD_FCITX=OFF \
            -DBUILD_DAEMON=OFF

      - name: Build
        run: cmake --build build

      - name: Package zip
        run: |
          chmod +x scripts/package-macos.sh scripts/macos-sign.sh
          ./scripts/package-macos.sh

      - name: Sign and notarize
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          if [ -z "${APPLE_CERTIFICATE_BASE64}" ]; then
            echo "No Apple signing certificate; publishing the unsigned zip and dmg"
            exit 0
          fi
          ver="$(sed -n 's/.*(\([^)]*\)).*/\1/p' packaging/deb/changelog | head -n 1)"
          ./scripts/macos-sign.sh \
            build/src/gui/rocket-switcher-config.app \
            "dist/rocket-switcher_${ver}_macos.zip"

      - name: Upload macOS artefact
        uses: actions/upload-artifact@v4
        with:
          name: rocket-switcher-macos
          path: |
            dist/*.zip
            dist/*.dmg
          retention-days: 30

  # ---- Release (on tag) ----
  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [build-deb, build-rpm, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rocket-switcher-deb
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: rocket-switcher-rpm
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: rocket-switcher-macos
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
